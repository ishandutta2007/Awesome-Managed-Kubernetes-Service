<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>

    <radialGradient id="sphereGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .grid-line { stroke: #334155; stroke-width: 1; opacity: 0.3; }
    .pulse-node { animation: pulse 3s infinite ease-in-out; }
    .orbit-circle { animation: rotateOrbit 20s linear infinite; transform-origin: 1000px 180px; }
    .floating-card { animation: float 4s infinite ease-in-out; }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.4; }
      50% { transform: scale(1.15); opacity: 0.9; }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }

    @keyframes rotateOrbit {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .title {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 800;
      font-size: 42px;
      fill: #ffffff;
    }

    .subtitle {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 500;
      font-size: 19px;
      fill: #94a3b8;
    }

    .badge-text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #38bdf8;
    }
  </style>

  <!-- Base Canvas -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Tech Mesh / Grid Background -->
  <g class="grid-layer">
    <!-- Perspective Grid Lines -->
    <line x1="0" y1="60" x2="1200" y2="60" class="grid-line" />
    <line x1="0" y1="120" x2="1200" y2="120" class="grid-line" />
    <line x1="0" y1="180" x2="1200" y2="180" class="grid-line" />
    <line x1="0" y1="240" x2="1200" y2="240" class="grid-line" />
    <line x1="0" y1="300" x2="1200" y2="300" class="grid-line" />

    <line x1="150" y1="0" x2="150" y2="360" class="grid-line" />
    <line x1="350" y1="0" x2="350" y2="360" class="grid-line" />
    <line x1="550" y1="0" x2="550" y2="360" class="grid-line" />
    <line x1="750" y1="0" x2="750" y2="360" class="grid-line" />
    <line x1="950" y1="0" x2="950" y2="360" class="grid-line" />
    <line x1="1150" y1="0" x2="1150" y2="360" class="grid-line" />
  </g>

  <!-- Background Decorative Glowing Orbs (Behind Content) -->
  <circle cx="1000" cy="180" r="140" fill="url(#sphereGlow)" />
  <circle cx="200" cy="100" r="100" fill="url(#sphereGlow)" opacity="0.5" />

  <!-- Animated Background Nodes (Kept in Background behind Text) -->
  <g class="orbit-circle" opacity="0.6">
    <circle cx="1000" cy="180" r="110" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="8 8" />
    <circle cx="1000" cy="70" r="7" fill="#38bdf8" filter="url(#glow)" />
    <circle cx="1110" cy="180" r="5" fill="#8b5cf6" />
    <circle cx="890" cy="180" r="6" fill="#ec4899" />
  </g>

  <!-- Floating K8s Architecture Node Graphic (Right Side Background) -->
  <g class="floating-card" transform="translate(860, 80)" filter="url(#shadow)">
    <rect width="260" height="200" rx="14" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1.5" />
    <!-- Mini Graphic Elements -->
    <path d="M40 50 L130 30 L220 50 L220 150 L130 170 L40 150 Z" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4" />
    <!-- Kubernetes Wheel Graphic -->
    <g transform="translate(130, 100)">
      <circle r="30" fill="#326ce5" fill-opacity="0.2" stroke="#326ce5" stroke-width="2" />
      <polygon points="0,-24 7,-7 24,-7 11,3 16,20 0,9 -16,20 -11,3 -24,-7 -7,-7" fill="#326ce5" />
    </g>
  </g>

  <!-- Foreground Content Block (Layered Above Background) -->
  <!-- Top Tag / Pill -->
  <g transform="translate(70, 65)">
    <rect width="280" height="32" rx="16" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
    <circle cx="18" cy="16" r="5" fill="#10b981" class="pulse-node" />
    <text x="32" y="21" class="badge-text">MANAGED KUBERNETES ECOSYSTEM</text>
  </g>

  <!-- Main Title -->
  <text x="70" y="145" class="title" filter="url(#shadow)">
    Awesome Managed Kubernetes
  </text>

  <!-- Gradient Accent Bar Under Title -->
  <rect x="70" y="165" width="480" height="4" rx="2" fill="url(#primaryGlow)" />

  <!-- Subtitle -->
  <text x="70" y="210" class="subtitle">
    Curated SaaS Platforms, Self-Hosted K8s Distributions,
  </text>
  <text x="70" y="238" class="subtitle">
    Control Plane Pricing &amp; Open-Source Ecosystem Directory
  </text>

  <!-- Bottom Metric Pills -->
  <g transform="translate(70, 275)">
    <rect width="130" height="30" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="16" y="20" font-family="sans-serif" font-size="12" fill="#e2e8f0" font-weight="600">☁️ 10+ SaaS K8s</text>
  </g>

  <g transform="translate(215, 275)">
    <rect width="150" height="30" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="16" y="20" font-family="sans-serif" font-size="12" fill="#e2e8f0" font-weight="600">🚀 20+ Open Source</text>
  </g>

  <g transform="translate(380, 275)">
    <rect width="140" height="30" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="16" y="20" font-family="sans-serif" font-size="12" fill="#e2e8f0" font-weight="600">💰 Pricing &amp; SLAs</text>
  </g>
</svg>
